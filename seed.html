<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar datos</title>
<style>body{font:16px system-ui;max-width:420px;margin:40px auto;padding:0 16px}input,button{width:100%;padding:12px;margin:6px 0;font:inherit}#msg{white-space:pre-wrap}</style>
</head>
<body>
<h1>Cargar datos de ejemplo</h1>
<form id="f"><input id="u" type="email" placeholder="Correo del dueño"><input id="c" type="password" placeholder="Contraseña"><button>Entrar</button></form>
<button id="go" hidden>Cargar productos, promociones y avisos</button>
<p id="msg"></p>
<script type="module">
import { auth, db, sesionActual } from "./js/firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id), msg = t => $("msg").textContent = t;
const ean = b => { let s = 0; for (let i = 0; i < 12; i++) s += +b[i] * (i % 2 ? 3 : 1); return b + (10 - s % 10) % 10; };

// [nombre, precio con IVA, departamento, tasa IVA, código (12 dígitos = EAN-13, corto = suelto), stock, unidad]
const DATOS = [
["Leche Lala Entera 1 L",27.5,"Abarrotes",0,"750102050001",40],
["Pan Bimbo Blanco Grande 680 g",46,"Abarrotes",0,"750100011120",25],
["Huevo San Juan Blanco 12 pzas",52,"Abarrotes",0,"750105530007",3],
["Arroz Verde Valle 1 kg",32,"Abarrotes",0,"750104009002",30],
["Frijol Negro La Sierra 900 g",38,"Abarrotes",0,"750104001136",26],
["Aceite 1-2-3 Vegetal 900 ml",44,"Abarrotes",0,"750102100094",20],
["Atún Dolores en Agua 140 g",24,"Abarrotes",0,"750107200451",48],
["Coca-Cola 600 ml",19,"Bebidas",.16,"750105536305",60],
["Agua Bonafont 1 L",13,"Bebidas",0,"750103131130",80],
["Jugo del Valle Naranja 1 L",31,"Bebidas",.16,"750101312704",18],
["Nescafé Clásico 100 g",74,"Bebidas",.16,"750105927315",0],
["Sabritas Original 45 g",21,"Botanas",.16,"750101111212",50],
["Galletas Marías Gamesa 170 g",18,"Botanas",.16,"750100061371",45],
["Chocolate Carlos V 18 g",10,"Botanas",.16,"750100013101",70],
["Takis Fuego 56 g",20,"Botanas",.16,"750101130506",42],
["Jabón Zote Rosa 400 g",22,"Limpieza",.16,"750102602001",36],
["Detergente Ariel 850 g",52,"Limpieza",.16,"750102540706",22],
["Papel Higiénico Regio 4 rollos",44,"Limpieza",.16,"750110881101",30],
["Cloralex 1 L",21,"Limpieza",.16,"750102210052",24],
["Fibra Scotch-Brite Verde",11,"Limpieza",.16,"750100330820",4],
["Pasta Dental Colgate Triple Acción 75 ml",36,"Higiene",.16,"750103640008",33],
["Cigarros Marlboro Rojo cajetilla 20 pzas",96,"Tabaco",.16,"750100222233",40],
["Huevo suelto (pieza)",5.5,"Abarrotes",0,"1",120],
["Cigarro Marlboro Rojo suelto",9,"Tabaco",.16,"2",200],
["Azúcar estándar suelta (kg)",34,"Abarrotes",0,"3",25,"kg"],
["Cerveza Corona Extra 355 ml",22,"Cervezas",.16,"750100551122",96],
["Cerveza Victoria 355 ml",20,"Cervezas",.16,"750100551245",72]
];
const prods = DATOS.map(a => ({ nombre: a[0], precio: a[1], departamento: a[2], iva: a[3], codigo: a[4].length === 12 ? ean(a[4]) : a[4], stock: a[5], unidad: a[6] || "pza" }));
const cod = n => prods.find(p => p.nombre.startsWith(n)).codigo;

const PROMOS = [
  { id: "2x1-cervezas", nombre: "2x1 en cervezas", tipo: "nxm", n: 2, m: 1, productos: [cod("Cerveza Corona"), cod("Cerveza Victoria")], etiqueta: "2x1", vigencia: "Del 1 al 31 de octubre", dias: [], activa: true },
  { id: "3x2-marias", nombre: "3x2 en Galletas Marías Gamesa", tipo: "nxm", n: 3, m: 2, productos: [cod("Galletas Marías")], etiqueta: "3x2", vigencia: "Hasta agotar existencias", dias: [], activa: true },
  { id: "ariel-15", nombre: "15% en Detergente Ariel 850 g", tipo: "pct", pct: 15, productos: [cod("Detergente Ariel")], etiqueta: "−15%", vigencia: "Del 5 al 18 de octubre", dias: [], activa: true },
  { id: "martes-lacteos", nombre: "Martes de lácteos: 20% en Leche Lala", tipo: "pct", pct: 20, productos: [cod("Leche Lala")], etiqueta: "−20%", vigencia: "Todos los martes", dias: [2], activa: true }
];
const AVISOS = [
  { texto: "Hoy la tienda cierra a las 8 p. m.", importante: false },
  { texto: "No recibir billetes de $500 hasta nuevo aviso.", importante: true },
  { texto: "Promoción 2x1 en cervezas vigente hasta el 31 de octubre.", importante: false }
];

$("f").onsubmit = async e => {
  e.preventDefault();
  try {
    await signInWithEmailAndPassword(auth, $("u").value.trim(), $("c").value);
    const s = await sesionActual();
    if (!s || !s.perfil || s.perfil.rol !== "admin") return msg("Esta cuenta no es de administrador.");
    $("f").hidden = true; $("go").hidden = false; msg("Sesión de administrador lista.");
  } catch (err) { msg("No se pudo entrar: " + err.code); }
};

$("go").onclick = async () => {
  $("go").disabled = true; msg("Cargando…");
  try {
    const b = writeBatch(db);
    prods.forEach(p => {
      b.set(doc(db, "productos", p.codigo), { nombre: p.nombre, precio: p.precio, departamento: p.departamento, iva: p.iva, stock: p.stock, stockMinimo: 5, unidad: p.unidad, activo: true, creado: serverTimestamp() });
      b.set(doc(db, "productosPrivado", p.codigo), { costo: Math.round(p.precio * 70) / 100 });
    });
    PROMOS.forEach(({ id, ...r }) => b.set(doc(db, "promociones", id), r));
    AVISOS.forEach((a, i) => b.set(doc(db, "avisos", "a" + (i + 1)), { ...a, creado: serverTimestamp() }));
    b.set(doc(db, "contadores", "folio"), { folio: 0 });
    await b.commit();
    msg("Listo: " + prods.length + " productos, " + PROMOS.length + " promociones y " + AVISOS.length + " avisos cargados.\nYa puedes borrar seed.html del repositorio.");
  } catch (err) { msg("Error: " + err.message); $("go").disabled = false; }
};
</script>
</body>
</html>
