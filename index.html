<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda · Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="screen on">
  <form class="ticket" id="fl" novalidate>
    <div class="tabs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="logo" aria-hidden="true">🛒</div>
    <h1>Tienda</h1>
    <p class="sub">Inicia sesión para abrir caja</p>

    <label for="u">Correo
      <span class="in"><input id="u" name="u" type="email" autocomplete="email" autocapitalize="none" spellcheck="false"></span>
    </label>
    <label for="c">Contraseña
      <span class="in"><input id="c" name="c" type="password" autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">Mostrar</button></span>
    </label>

    <p class="err" id="err" role="alert"></p>
    <button class="go" id="enter" type="submit">Entrar</button>
    <p class="foot" id="fecha"></p>
  </form>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
